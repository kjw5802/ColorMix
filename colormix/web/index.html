<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ColorMix</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 화면 뼈대만 둔다. 글자는 data-i18n 키로 data/strings.json에서 채우고, 동작은 js/ 파일들이 맡는다 -->
<div class="wrap" id="app">
  <header>
    <h1 data-i18n="title"></h1>
    <nav id="nav" data-i18n-aria="menu">
      <button type="button" data-tab="main" data-i18n="tabMain"></button>
      <button type="button" data-tab="palette" id="navpal"></button>
      <button type="button" data-tab="library" data-i18n="tabLib"></button>
      <button type="button" data-tab="owned" data-i18n="tabOwned"></button>
      <button type="button" data-tab="paints" data-i18n="tabPaints"></button>
      <button type="button" data-tab="data" data-i18n="tabData"></button>
    </nav>
    <div class="hright">
    <div id="filebar"><span id="filestat"></span><button type="button" id="fsave" data-i18n="fileSave"></button><button type="button" id="fexit" data-i18n="exit"></button></div>
    <button type="button" id="langbtn" data-i18n-title="lang"></button>
    </div>
  </header>

  <!-- 스포이드 -->
  <div class="main" id="tab-main">
    <div class="left">
      <div class="bar">
        <label class="filebtn"><span data-i18n="load"></span><input id="file" type="file" accept="image/*"></label>
        <label><span data-i18n="size"></span>
          <select id="size"><option value="0">1×1 px</option><option value="2" selected data-i18n="avg" data-arg="5×5"></option><option value="5" data-i18n="avg" data-arg="11×11"></option></select>
        </label>
        <div class="zoom" role="group" data-i18n-aria="zoom">
          <button type="button" id="zoomout" data-i18n-aria="zoomOut" data-i18n-title="zoomOut">－</button>
          <span id="zoomval"></span>
          <button type="button" id="zoomin" data-i18n-aria="zoomIn" data-i18n-title="zoomIn">＋</button>
          <button type="button" id="zoomfit" data-i18n="zoomFit"></button>
          <button type="button" id="zoom100">100%</button>
        </div>
      </div>
      <div class="bar">
        <button type="button" id="refwhite" data-i18n="refWhite"></button>
        <button type="button" id="refgray" data-i18n="refGray"></button>
        <label><input type="checkbox" id="showorig"> <span data-i18n="showOrig"></span></label>
        <button type="button" id="corroff" data-i18n="corrOff" disabled></button>
      </div>
      <div class="regbar" id="regbar" hidden><span id="regtext"></span><button type="button" id="regskip" data-i18n="regSkip"></button><button type="button" id="regcancel" data-i18n="regCancel"></button></div>
      <div class="stage" id="stage">
        <div class="vp" id="vp"><div class="cv"><canvas id="cv" width="900" height="560"></canvas><div class="mark" id="mark" hidden></div><div class="refmark" id="refmark" hidden></div></div></div>
        <div class="hint"><span class="hov" id="hov"></span><span id="hint"></span></div>
        <div class="hint" id="corrmsg"></div>
        <div class="hint" data-i18n="zoomHelp"></div>
      </div>
    </div>
    <div class="side">
      <section>
        <h2 data-i18n="picked"></h2>
        <div class="pickrow">
          <div class="big" id="big"></div>
          <div class="pickinfo">
            <dl>
              <dt>HEX</dt><dd id="hex"></dd>
              <dt>RGB</dt><dd id="rgb"></dd>
              <dt>HSV</dt><dd id="hsv"></dd>
              <dt>L*a*b*</dt><dd id="lab"></dd>
              <dt data-i18n="mixDt"></dt><dd id="mixr"></dd>
              <dt data-i18n="printDt"></dt><dd id="cmyk"></dd>
            </dl>
            <span class="badge satb" id="satbadge" hidden></span>
            <div class="bar" style="gap:6px"><button type="button" id="addpal" class="primary" data-i18n="addPal"></button><button type="button" id="regpick" data-i18n="regFromPicked"></button></div>
            <span class="note" id="addmsg" style="margin:0"></span>
            <div class="recent" id="recent" hidden><span class="plabel" data-i18n="recentTitle"></span><div class="rsw" id="recentsw"></div></div>
          </div>
        </div>
        <p class="warn" id="clipwarn" hidden></p>
        <p class="warn" id="spreadwarn" hidden></p>
      </section>
      <!-- 배합 제안을 찍은 색 바로 아래에 둔다 (스크롤 없이 보이도록) -->
      <section class="mixsec">
        <label class="switch"><input type="checkbox" id="nometal" checked><span class="track" aria-hidden="true"></span><span data-i18n="noMetal"></span></label>
        <h2 data-i18n="mixTitle"></h2>
        <div class="seg" id="seg"></div>
        <div id="recs"></div>
        <p class="note" id="mixnote"></p>
      </section>
      <!-- 명암 세트: 필요할 때만 펼친다 -->
      <section class="setsec">
        <details id="setbox">
        <summary><h2 data-i18n="setTitle"></h2></summary>
        <label><span data-i18n="partLabel"></span> <select id="part"></select></label>
        <div class="slots">
          <button type="button" class="slot" id="slot-hl" data-tone="hl"><span class="ssw"></span><span data-i18n="tone_hl"></span><span class="shx">—</span></button>
          <button type="button" class="slot" id="slot-base" data-tone="base"><span class="ssw"></span><span data-i18n="tone_base"></span><span class="shx">—</span></button>
          <button type="button" class="slot" id="slot-sh" data-tone="sh"><span class="ssw"></span><span data-i18n="tone_sh"></span><span class="shx">—</span></button>
        </div>
        <ul class="rel" id="rel"></ul>
        <p class="note" data-i18n="setHelp"></p>
        <p class="bar" style="margin:12px 0 0"><button type="button" id="setadd" class="primary" data-i18n="setAdd"></button><button type="button" id="setclear" data-i18n="setClear"></button><span class="note" id="setmsg" style="margin:0"></span></p>
        </details>
      </section>
    </div>
  </div>

  <!-- 팔레트 -->
  <div class="main" id="tab-palette" hidden>
    <div class="left">
      <div class="stage"><canvas id="pal" width="1600" height="1000" style="cursor:default;align-self:center"></canvas></div>
    </div>
    <div class="side">
      <section>
        <h2 data-i18n="palColors"></h2>
        <label><span data-i18n="basisLabel"></span> <select id="basis"></select></label>
        <p class="mono" id="basismap" style="margin:4px 0 8px"></p>
        <p class="note" data-i18n="mixDtNote" style="margin:0 0 8px"></p>
        <div id="pallist"></div>
        <p class="note" data-i18n="palNote"></p>
      </section>
      <section>
        <h2 data-i18n="export"></h2>
        <div class="bar"><button type="button" id="expng" class="primary" data-i18n="savePng"></button><button type="button" id="expdf" class="primary" data-i18n="savePdf"></button><button type="button" id="palclear" data-i18n="clearPal"></button></div>
        <p class="note" id="exmsg"></p>
      </section>
      <section>
        <h2 data-i18n="libSaveTitle"></h2>
        <div class="form2" id="metaform">
          <label class="full"><span data-i18n="f_name"></span><input type="text" id="m-name" maxlength="60"></label>
          <label><span data-i18n="f_event"></span><input type="text" id="m-event" list="dl-event" maxlength="80"></label>
          <label><span data-i18n="f_date"></span><input type="date" id="m-date"></label>
          <label><span data-i18n="f_sculptor"></span><input type="text" id="m-sculptor" list="dl-sculptor" maxlength="80"></label>
          <label><span data-i18n="f_link"></span><input type="url" id="m-link" maxlength="300" placeholder="https://"></label>
          <label class="full"><span data-i18n="f_memo"></span><textarea id="m-memo" rows="2" maxlength="500"></textarea></label>
        </div>
        <datalist id="dl-event"></datalist><datalist id="dl-sculptor"></datalist>
        <label id="ow-wrap" hidden style="display:block;margin-top:8px"><input type="checkbox" id="m-overwrite" checked> <span id="ow-text"></span></label>
        <p class="bar" style="margin:10px 0 0"><button type="button" id="palsave" class="primary" data-i18n="savePal"></button></p>
        <p class="note" id="savemsg"></p>
        <p class="note" data-i18n="libSaveNote"></p>
      </section>
    </div>
  </div>

  <!-- 라이브러리 -->
  <section id="tab-library" hidden>
    <div class="lbar">
      <input type="search" id="lq" data-i18n-ph="libSearch" data-i18n-aria="libSearch">
      <select id="lpart" data-i18n-aria="partLabel"></select>
      <select id="levent" data-i18n-aria="f_event"></select>
      <div class="seg" id="lview" style="margin:0"><button type="button" data-v="entry" data-i18n="viewEntry"></button><button type="button" data-v="part" data-i18n="viewPart"></button></div>
    </div>
    <p class="mono" id="lcount"></p>
    <div id="libbody"></div>
    <h2 style="margin-top:24px" data-i18n="printTitle"></h2>
    <div class="bar"><label><input type="checkbox" id="lphoto" checked> <span data-i18n="withPhoto"></span></label><button type="button" id="lpdf" class="primary" data-i18n="savePdfA4"></button></div>
    <p class="note" id="lmsg"></p>
    <p class="note" id="lprintnote"></p>
  </section>

  <!-- 보유 도료 -->
  <section id="tab-owned" hidden>
    <div class="bar">
      <h2 style="margin:0" id="ownedcount"></h2>
      <label><span data-i18n="sort"></span>
        <select id="sort"><option value="brand" data-i18n="sBrand"></option><option value="no" data-i18n="sNo"></option><option value="color" data-i18n="sColor"></option></select>
      </label>
      <label><span data-i18n="typeLabel"></span>
        <select id="tfilter"><option value="all" data-i18n="filterAll"></option><option value="normal" data-i18n="type_normal"></option><option value="clear" data-i18n="type_clear"></option><option value="colorless" data-i18n="clearColorless"></option><option value="metallic" data-i18n="type_metallic"></option></select>
      </label>
      <label><span data-i18n="finishLabel"></span>
        <select id="ffilter"><option value="all" data-i18n="filterAllFinish"></option><option value="gloss" data-i18n="fin_gloss"></option><option value="semi" data-i18n="fin_semi"></option><option value="matte" data-i18n="fin_matte"></option></select>
      </label>
    </div>
    <div class="grid" id="ownedgrid"></div>
    <p class="note" data-i18n="ownedNote"></p>
  </section>

  <!-- 보정 -->
  <section id="tab-paints" hidden>
    <h2 data-i18n="addTitle"></h2>
    <form class="add" id="add">
      <select id="add-brand" data-i18n-aria="brand"></select>
      <input type="text" id="add-no" data-i18n-ph="phNo" required data-i18n-aria="phNo">
      <input type="text" id="add-name" data-i18n-ph="phName" required data-i18n-aria="phName">
      <select id="add-type" data-i18n-aria="typeLabel"><option value="normal" data-i18n="type_normal"></option><option value="clear" data-i18n="type_clear"></option><option value="metallic" data-i18n="type_metallic"></option></select>
      <label id="add-cl-wrap" hidden><input type="checkbox" id="add-colorless"> <span data-i18n="colorless"></span></label>
      <select id="add-finish" data-i18n-aria="finishLabel"><option value="gloss" data-i18n="fin_gloss"></option><option value="semi" data-i18n="fin_semi"></option><option value="matte" data-i18n="fin_matte"></option></select>
      <input type="color" id="add-hex" value="#808080" data-i18n-aria="color">
      <button type="submit" data-i18n="add"></button>
    </form>
    <p class="note" data-i18n="calNote"></p>
    <p class="note" data-i18n="clearInfo"></p>
    <div class="ptool" id="ptool">
      <div class="seg" id="pbrand" role="group" data-i18n-aria="brand"></div>
      <div class="lbar"><input type="search" id="psearch" data-i18n-ph="paintSearch" data-i18n-aria="paintSearch"><label><input type="checkbox" id="ponly"> <span data-i18n="ownedOnly"></span></label><label><input type="checkbox" id="pmeas"> <span data-i18n="measEdit"></span></label><button type="button" id="regbatch" data-i18n="regBatch"></button><span class="note" id="regmsg" style="margin:0"></span></div>
    </div>
    <div id="rows"></div>
    <div class="bar" style="margin-top:20px"><button id="reset" type="button" data-i18n="reset"></button><span class="note" id="resetmsg" style="margin:0"></span></div>
  </section>

  <!-- 데이터 -->
  <section id="tab-data" hidden>
    <h2 data-i18n="fileTitle"></h2>
    <div class="bar"><button type="button" id="fsave2" class="primary" data-i18n="fileSave"></button><button type="button" id="backsave" data-i18n="saveAs"></button><button type="button" id="backfile" data-i18n="backupLoadData"></button></div>
    <p class="note" id="filemsg"></p>
    <p class="mono" id="filepath" style="margin:8px 0;overflow-wrap:anywhere"></p>
    <p class="note" data-i18n="noteSave"></p>
    <p class="note" data-i18n="noteSaveAs"></p>
    <p class="note" data-i18n="noteLoad"></p>
  </section>
</div>

<div class="modal" id="regdlg" hidden>
  <div class="mbox regbox" role="dialog" aria-modal="true" aria-labelledby="regdlgtitle">
    <div class="hhead"><h2 id="regdlgtitle"></h2><button type="button" id="regdlgclose" data-i18n-aria="close">×</button></div>
    <input type="search" id="regq" data-i18n-ph="paintSearch" data-i18n-aria="paintSearch">
    <div class="regsel" id="regsel"></div>
    <div class="reglist" id="reglist"></div>
    <div class="bar"><button type="button" id="regstart" class="primary"></button></div>
  </div>
</div>
<div class="modal" id="regconf" hidden>
  <div class="mbox regbox" role="dialog" aria-modal="true" aria-labelledby="regconftitle">
    <h2 id="regconftitle"></h2>
    <div class="regcmp">
      <div><span class="plabel" data-i18n="regNow"></span><span class="rsw2" id="rc-old"></span><span class="mono" id="rc-oldhex"></span></div>
      <div class="arrow">→</div>
      <div><span class="plabel" data-i18n="regNew"></span><span class="rsw2" id="rc-new"></span><span class="mono" id="rc-newhex"></span></div>
      <div class="mono" id="rc-de"></div>
    </div>
    <ul class="regcond" id="rc-cond"></ul>
    <label class="regnote"><span data-i18n="regNote"></span><input type="text" id="rc-note" maxlength="120" data-i18n-ph="regNotePh"></label>
    <div class="bar"><button type="button" id="rc-ok" class="primary" data-i18n="regOk"></button><button type="button" id="rc-again" data-i18n="regAgain"></button><button type="button" id="rc-skip" data-i18n="regSkip"></button><button type="button" id="rc-cancel" data-i18n="regCancel"></button></div>
  </div>
</div>
<div class="modal" id="helpdlg" hidden>
  <div class="mbox helpbox" role="dialog" aria-modal="true" aria-labelledby="helptitle">
    <div class="hhead"><h2 id="helptitle"></h2><button type="button" id="helpclose" data-i18n-aria="close">×</button></div>
    <div id="helpbody"></div>
  </div>
</div>
<div class="modal" id="exitdlg" role="dialog" aria-modal="true" aria-labelledby="exittitle" hidden>
  <div class="mbox">
    <h2 id="exittitle" data-i18n="exitTitle"></h2>
    <p id="exitbody" style="margin:0"></p>
    <div class="bar"><button type="button" id="exsave" class="primary" data-i18n="exitSave"></button><button type="button" id="exnosave" data-i18n="exitNoSave"></button><button type="button" id="excancel" data-i18n="cancel"></button></div>
    <p class="note" id="exitmsg"></p>
  </div>
</div>

<!-- 읽는 순서가 중요하다: 앞 파일의 함수·변수를 뒤 파일이 쓴다. main.js가 마지막에 시작한다 -->
<script src="js/base.js"></script>
<script src="js/color.js"></script>
<script src="js/paints.js"></script>
<script src="js/eyedropper.js"></script>
<script src="js/suggest.js"></script>
<script src="js/palette.js"></script>
<script src="js/library.js"></script>
<script src="js/paintlist.js"></script>
<script src="js/register.js"></script>
<script src="js/datafile.js"></script>
<script src="js/help.js"></script>
<script src="js/main.js"></script>
</body>
</html>
